name: Safe to Share Pro interest
description: Share how you review confidential PDFs before release.
title: "[Founding Pro] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Safe to Share Pro.

        This creates a public GitHub issue. Do not include filenames, document contents, passwords, client names, personal contact details, or other confidential information.
  - type: dropdown
    id: workflow
    attributes:
      label: Which recurring release job matters most?
      description: Choose the closest job. This is product research, not a purchase.
      options:
        - Check and sanitize one PDF before sending it
        - Batch-check a folder of documents
        - Reuse a release policy for the same client or matter
        - Search and redact repeated sensitive terms
        - Keep a local history of verification receipts
        - Another confidential document-release workflow
    validations:
      required: true
  - type: dropdown
    id: price_intent
    attributes:
      label: Which price would you seriously consider if it solved this job?
      options:
        - $9 for a 72-hour release pass
        - $12 per month for unlimited releases
        - $99 per year for unlimited releases
        - I need to see more before considering payment
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Optional context
      description: Describe the steps or time cost, but do not include sensitive document or personal information.
      placeholder: "Example: I review and release several client PDFs each week."
