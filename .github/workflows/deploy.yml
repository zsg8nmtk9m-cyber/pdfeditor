name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/pdf-tools-web-app-yyx410, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages has no SPA rewrite support; serving the app as the 404
      # page makes deep links like /merge load the router anyway.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      # Publishes dist/ to the gh-pages branch. GitHub auto-enables Pages
      # for a branch named gh-pages, so no manual setup is needed — the
      # modern artifact-based deploy (actions/deploy-pages) can't create
      # the Pages site with GITHUB_TOKEN, this route can.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
